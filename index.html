<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#001028" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JBM Drinks — Bar POS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function () {
        var t = localStorage.getItem('jbm_drinks_theme') || 'modern';
        if (t === 'light') t = 'modern';
        if (t === 'dark') t = 'classic';
        var lang = localStorage.getItem('jbm_drinks_lang') === 'ja' ? 'ja' : 'en';
        var w = window.innerWidth;
        var h = window.innerHeight;
        var screenShort = Math.min((window.screen && window.screen.width) || w, (window.screen && window.screen.height) || h);
        var coarse = window.matchMedia('(pointer: coarse)').matches;
        var phone = screenShort <= 700 || (coarse && Math.min(w, h) <= 520);
        var device = phone ? 'phone' : (w < 1280 || coarse ? 'tablet' : 'desktop');
        var layout = device === 'phone' ? 'mobile' : device;
        try { localStorage.removeItem('jbm_drinks_layout'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-layout', layout);
        document.documentElement.setAttribute('data-device', device);
        document.documentElement.setAttribute('data-pointer', window.matchMedia('(pointer: coarse)').matches ? 'coarse' : 'fine');
        document.documentElement.setAttribute('data-orientation', window.innerHeight >= window.innerWidth ? 'portrait' : 'landscape');
        document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
