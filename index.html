    <title>JBM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="JBM" />
    <script>
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('jbm_drinks_theme') || 'system'; } catch (e) {}
        if (t === 'light') t = 'modern';
        if (t === 'dark') t = 'classic';
        if (t !== 'modern' && t !== 'classic') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'classic' : 'modern';
        }
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', t === 'classic' ? '#101B19' : '#F4F7F5');
        var lang = 'en';
        try { lang = localStorage.getItem('jbm_drinks_lang') === 'ja' ? 'ja' : 'en'; } catch (e) {}
        var w = window.innerWidth;
        var h = window.innerHeight;
        var screenShort = Math.min((window.screen && window.screen.width) || w, (window.screen && window.screen.height) || h);
        var coarse = window.matchMedia('(pointer: coarse)').matches;
        var phone = screenShort <= 700 || (coarse && Math.min(w, h) <= 520);
        var device = phone ? 'phone' : (w < 1280 || coarse ? 'tablet' : 'desktop');
        var layout = device === 'phone' ? 'mobile' : device;
        try { localStorage.removeItem('jbm_drinks_layout'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-layout', layout);
        document.documentElement.setAttribute('data-device', device);
        document.documentElement.setAttribute('data-pointer', window.matchMedia('(pointer: coarse)').matches ? 'coarse' : 'fine');
        document.documentElement.setAttribute('data-orientation', window.innerHeight >= window.innerWidth ? 'portrait' : 'landscape');
        document.documentElement.lang = lang;
      })();
    </script>
    <style>
      /* Opening screen: drawn before the app's JS loads, so an installed app never starts on a blank page.
         The app fades it out once it knows who is signed in (src/lib/bootSplash.js). */
      html, body { background: #13201D; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(120% 80% at 50% 42%, #1B2B27 0%, #13201D 55%, #0C1513 100%);
        transition: opacity .32s ease, transform .32s ease;
      }
      #boot-splash.bs-out { opacity: 0; transform: scale(1.03); pointer-events: none; }
      #boot-splash .bs-mark { width: clamp(96px, 28vw, 132px); height: auto; overflow: visible; }
      #boot-splash .bs-frame { fill: none; stroke: #F0F3F0; stroke-width: 42;
        stroke-dasharray: 1; stroke-dashoffset: 1; animation: bs-draw .95s cubic-bezier(.65,0,.35,1) .05s forwards; }
      #boot-splash .bs-corner { fill: #83B7A0; transform-box: fill-box; transform-origin: 100% 0;
        opacity: 0; transform: scale(.4); animation: bs-pop .45s cubic-bezier(.34,1.56,.64,1) .8s forwards; }
      #boot-splash .bs-l { fill: #F0F3F0; opacity: 0; transform: translateY(40px);
        animation: bs-rise .5s cubic-bezier(.22,1,.36,1) forwards; }
      #boot-splash .bs-j { animation-delay: .35s; }
      #boot-splash .bs-b { animation-delay: .5s; }
      #boot-splash .bs-m { animation-delay: .65s; }
      #boot-splash .bs-bar { width: 56px; height: 2px; border-radius: 2px; overflow: hidden;
        background: rgba(240,243,240,.10); opacity: 0; animation: bs-fade .4s ease 1.3s forwards; }
      #boot-splash .bs-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #83B7A0;
        transform: translateX(-100%); animation: bs-slide 1.2s ease-in-out 1.3s infinite; }
      @keyframes bs-draw { to { stroke-dashoffset: 0; } }
      @keyframes bs-pop  { to { opacity: 1; transform: none; } }
      @keyframes bs-rise { to { opacity: 1; transform: none; } }
      @keyframes bs-fade { to { opacity: 1; } }
      @keyframes bs-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, #boot-splash * { animation: none !important; transition-duration: .01s !important; }
        #boot-splash .bs-frame { stroke-dashoffset: 0; }
        #boot-splash .bs-corner, #boot-splash .bs-l { opacity: 1; transform: none; }
        #boot-splash .bs-bar { display: none; }
      }
    </style>
  </head>

        <path class="bs-l bs-m" d="M1465.2,948.4v428.2h-119v-236.3l-80.8,236.3h-99.6l-81.4-238.1v238.1h-119v-428.2h143.9l107.5,278.2,105.1-278.2h143.3Z"/>
      </svg>
      <div class="bs-bar"><i></i></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-splash');
        var t0 = Date.now();
        var done = false;
        // Lets the opening animation play through once; a ready app is never held longer than that.
        window.__jbmHideSplash = function () {
          if (done || !el) return;
          done = true;
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var wait = Math.max(0, (reduce ? 0 : 1150) - (Date.now() - t0));
          setTimeout(function () {
            el.classList.add('bs-out');
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 360);
          }, wait);
        };
        setTimeout(window.__jbmHideSplash, 15000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
