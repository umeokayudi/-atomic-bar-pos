<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 500">
  <defs>
    <style>
      .gold { fill: #c19c56; }
      .white { fill: #ffffff; }
      .navy { fill: #001028; }
    </style>
  </defs>
  <!-- Frame dourado simplificado -->
  <rect x="20" y="20" width="460" height="460" rx="8"
    fill="none" stroke="#c19c56" stroke-width="12"/>
  <polygon class="gold" points="380,20 460,20 460,100 380,20"/>
  <!-- JBM texto branco -->
  <text x="240" y="290" font-family="Georgia, serif" font-size="220"
    font-weight="700" text-anchor="middle" class="white" letter-spacing="-8">JBM</text>
  <!-- Subtexto dourado -->
  <text x="240" y="380" font-family="Georgia, serif" font-size="52"
    text-anchor="middle" class="gold" letter-spacing="18">DRINKS</text>
  <!-- Linha dourada decorativa -->
  <line x1="100" y1="320" x2="380" y2="320" stroke="#c19c56" stroke-width="2"/>
</svg>
